server:
  port: 8084

spring:
  application:
    name: project-management-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      # Token ACL para registrarse en un Consul con ACLs habilitadas (default deny).
      # Se inyecta por entorno; nunca hardcodear el secreto en el repo.
      # Si Consul rechaza/no responde, la app igual arranca (no crash-loop).
      fail-fast: false
      discovery:
        acl-token: ${CONSUL_TOKEN:30b4d3c6-55d7-0276-7f76-178a4d10da35}
        register: true
        deregister: true
        prefer-ip-address: true
        instance-id: ${spring.application.name}-${random.value}
        health-check-path: /health
        health-check-interval: 15s
  datasource:
    url: ${DB_URL:jdbc:mysql://204.168.203.32:3306/project_management_db}
    username: ${DB_USERNAME:landslide}
    password: ${DB_PASSWORD:}
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        pm.persist.latency: true
        http.server.requests: true
      slo:
        pm.persist.latency: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5000ms
        # http.server.requests: mismos cortes que el histograma HTTP de los 4
        # servicios Go (Sistema B) y del resto de servicios Spring/Flask de
        # Sistema A, para que histogram_quantile sea comparable entre sistemas.
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5000ms

app:
  seed:
    enabled: true
